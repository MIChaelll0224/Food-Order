<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Food Ordering System</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo Section -->
            <div class="auth-header">
                <div class="auth-logo-wrapper">
                    <img src="assets/pba-logo.png" alt="PBA logo" class="auth-logo" onerror="this.style.display='none'" />
                </div>
                <h1>Welcome Back</h1>
                <p class="auth-subtitle">Printing Business Academy - Food Ordering</p>
            </div>

            <!-- Form Section -->
            <form class="auth-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <input 
                        type="text" 
                        id="loginUsername" 
                        placeholder="Enter your username" 
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input 
                        type="password" 
                        id="loginPassword" 
                        placeholder="Enter your password" 
                        required
                    />
                </div>

                <button type="submit" class="button primary auth-button">Login</button>
            </form>

            <!-- Message Display -->
            <p id="loginMessage" class="auth-message"></p>
            <p class="auth-note">Use the admin account <strong>admin / 1234</strong> to access the admin dashboard with order history and daily sales. Newly registered accounts are regular users.</p>

            <!-- Footer Link -->
            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
                <p><a href="index.html" class="back-link">← Back to Home</a></p>
            </div>
        </div>

        <!-- Decorative elements -->
        <div class="auth-decoration decoration-1"></div>
        <div class="auth-decoration decoration-2"></div>
        <div class="auth-decoration decoration-3"></div>
    </div>

    <script src="login.js"></script>
</body>
</html>
